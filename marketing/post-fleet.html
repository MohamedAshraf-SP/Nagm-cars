<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بوست الأسطول - شركة نجم كار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@500;700&display=block">
<style>
:root {
  --night: #0F1433; --night-2: #23307A; --on-night: #F4F1E8; --gold: #F4C247; --navy: #121838; --wa: #1FA855;
  --display: "Lalezar", "IBM Plex Sans Arabic", sans-serif; --body: "IBM Plex Sans Arabic", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  font-family: var(--body); color: var(--on-night);
  background: radial-gradient(90% 50% at 50% 0%, var(--night-2), var(--night) 70%);
  padding: 44px 48px; display: flex; flex-direction: column; gap: 24px;
}
.head { display: grid; justify-items: center; gap: 4px; text-align: center; }
.head img { width: 360px; height: auto; filter: drop-shadow(0 10px 22px rgba(0,0,0,.45)); }
.head h1 { font-family: var(--display); font-weight: 400; font-size: 96px; line-height: 1; color: var(--gold); }
.head p { font-size: 38px; font-weight: 700; }

.fleet {
  flex: 1; min-height: 0; display: grid; gap: 14px;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  grid-template-rows: 1.25fr 1fr;
  grid-template-areas: "a a b b" "c d d e";
}
.car { position: relative; border-radius: 22px; overflow: hidden; border: 4px solid var(--gold); background: #000; }
.car img { width: 100%; height: 100%; object-fit: cover; object-position: center 62%; display: block; }
.car span {
  position: absolute; right: 12px; bottom: 12px; background: var(--navy); color: var(--gold);
  font-weight: 700; font-size: 24px; padding: 6px 16px; border-radius: 999px; border: 2px solid var(--gold);
}
.a { grid-area: a; } .b { grid-area: b; } .c { grid-area: c; } .d { grid-area: d; } .e { grid-area: e; }
.e img { object-position: 72% 60%; }

.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.chips span { text-align: center; font-size: 30px; font-weight: 700; padding: 14px 8px; border-radius: 16px; background: rgba(244,241,232,.08); border: 2px solid rgba(244,241,232,.2); }
.chips span::before { content: "✓ "; color: var(--gold); }

.cta { display: flex; align-items: center; justify-content: space-between; gap: 20px; background: var(--wa); color: #fff; border-radius: 26px; padding: 20px 30px; }
.cta .lbl { display: flex; align-items: center; gap: 14px; font-size: 42px; font-weight: 700; }
.cta svg { width: 54px; height: 54px; }
.cta .num { direction: ltr; font-family: var(--display); font-weight: 400; font-size: 64px; line-height: 1; }
.link { text-align: center; font-size: 25px; opacity: .85; margin-top: -10px; }
.link b { color: var(--gold); direction: ltr; unicode-bidi: isolate; }
</style>
</head>
<body>

</svg>

<header class="head">
  <img src="../images/logo.svg" alt="">
  <h1>شركة نجم كار</h1>
  <p>عربيات حديثة ومكيفة لكل مشاويرك</p>
</header>
