<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بوست الكيلو بـ 12 - شركة نجم كار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@500;700&display=block">
<style>
:root {
  --gold: #F4C247; --gold-deep: #E2A91E; --navy: #121838; --cream: #FFF8E6; --wa: #1FA855;
  --display: "Lalezar", "IBM Plex Sans Arabic", sans-serif; --body: "IBM Plex Sans Arabic", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  font-family: var(--body); color: var(--navy);
  background: radial-gradient(80% 60% at 20% 30%, #FFD46A, var(--gold) 55%, var(--gold-deep));
  display: flex; flex-direction: column; position: relative;
}
/* Cairo-taxi checker band */
.checker {
  height: 44px; flex: none;
  background:
    conic-gradient(var(--navy) 25%, var(--cream) 0 50%, var(--navy) 0 75%, var(--cream) 0) 0 0 / 44px 44px;
}
.inner { flex: 1; min-height: 0; padding: 40px 60px 44px; display: flex; flex-direction: column; gap: 26px; }

.brand { display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 14px; }
.logo svg { width: 64px; height: 64px; color: var(--navy); }
.logo b { font-family: var(--display); font-weight: 400; font-size: 60px; line-height: 1; }
.pill { font-weight: 700; font-size: 28px; background: var(--navy); color: var(--gold); padding: 10px 24px; border-radius: 999px; }

.hook { display: grid; gap: 0; }
.hook .pre { font-family: var(--display); font-weight: 400; font-size: 92px; line-height: 1; }
.hook .big { font-family: var(--display); font-weight: 400; font-size: 210px; line-height: .95; letter-spacing: -2px; }
.hook .big span { color: #fff; -webkit-text-stroke: 6px var(--navy); paint-order: stroke fill; }
.hook p { font-size: 40px; font-weight: 700; margin-top: 10px; }

.photo-wrap { position: relative; flex: 1; min-height: 0; }
.photo { position: absolute; inset: 0 0 0 40px; border-radius: 34px; overflow: hidden; border: 7px solid var(--navy); transform: rotate(-2deg); box-shadow: 0 24px 50px rgba(18,24,56,.35); }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 62%; display: block; }
.sticker {
  position: absolute; left: 0; top: -26px; width: 230px; height: 230px; border-radius: 50%;
  background: var(--navy); color: var(--gold); display: grid; place-content: center; text-align: center;
  font-family: var(--display); font-size: 36px; line-height: 1.15; transform: rotate(-10deg);
  box-shadow: 0 12px 30px rgba(18,24,56,.4); border: 5px dashed var(--gold);
}
.example {
  position: absolute; right: 26px; bottom: 26px; background: var(--cream); color: var(--navy);
  border-radius: 20px; padding: 14px 24px; font-size: 32px; font-weight: 700; box-shadow: 0 10px 26px rgba(0,0,0,.25);
}
.example b { font-family: var(--display); font-weight: 400; font-size: 46px; }

.chips { display: flex; gap: 14px; justify-content: space-between; }
.chips span { flex: 1; text-align: center; font-size: 30px; font-weight: 700; padding: 14px 8px; border-radius: 16px; border: 3px solid var(--navy); background: rgba(255,255,255,.35); }

.cta { display: flex; align-items: center; justify-content: space-between; gap: 20px; background: var(--navy); color: #fff; border-radius: 28px; padding: 22px 30px; }
.cta .lbl { display: flex; align-items: center; gap: 16px; font-size: 42px; font-weight: 700; }
.cta .lbl i { width: 74px; height: 74px; border-radius: 50%; background: var(--wa); display: grid; place-items: center; }
.cta svg { width: 46px; height: 46px; color: #fff; }
.cta .num { direction: ltr; font-family: var(--display); font-weight: 400; font-size: 68px; line-height: 1; color: var(--gold); }
.link { text-align: center; font-size: 26px; font-weight: 700; margin-top: -10px; }
.link b { direction: ltr; unicode-bidi: isolate; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.8l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9l7.1-.6z"/></symbol>
  <symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2Zm4.52 11.99c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28Z"/></symbol>
</svg>

<div class="checker"></div>
<div class="inner">
  <header class="brand">
    <div class="logo"><svg><use href="#star"/></svg><b>شركة نجم كار</b></div>
    <span class="pill">كل المحافظات</span>
  </header>

  <div class="hook">
    <span class="pre">الكيلو بـ</span>
    <span class="big"><span>12</span> جنيه بس!</span>
    <p>عربية نضيفة ومكيفة وكابتن محترم لحد باب بيتك</p>
  </div>

  <div class="photo-wrap">
    <div class="photo"><img src="../images/corolla.jpg" alt=""></div>
    <div class="sticker">من الباب<br>للباب</div>
    <div class="example">يعني مشوار 100 كم = <b>1,200 ج</b></div>
  </div>

  <div class="chips"><span>المطار</span><span>السفر</span><span>هايس للعيلة</span></div>

  <div class="cta">
    <span class="lbl"><i><svg><use href="#wa"/></svg></i>احجز دلوقتي</span>
    <span class="num">01043950220</span>
  </div>
  <p class="link">الأسعار والحجز: <b>mohamedashraf-sp.github.io/Nagm-cars</b></p>
</div>
<div class="checker"></div>
</body>
</html>
