<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بوست شركة نجم كار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@500;700&display=block">
<style>
:root {
  --night: #121838; --night-2: #1E2860; --on-night: #F4F1E8; --gold: #F0C04C; --ink: #121838; --wa: #1D9E50;
  --display: "Lalezar", "IBM Plex Sans Arabic", sans-serif; --body: "IBM Plex Sans Arabic", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  font-family: var(--body); color: var(--on-night);
  background: radial-gradient(110% 70% at 85% 0%, var(--night-2), var(--night) 65%);
  padding: 64px; display: flex; flex-direction: column; gap: 34px; position: relative;
}
.stars { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.stars circle { fill: var(--on-night); }
body > *:not(.stars) { position: relative; z-index: 1; }

.brand { display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 18px; }
.logo svg { width: 76px; height: 76px; color: var(--gold); }
.logo b { font-family: var(--display); font-weight: 400; font-size: 70px; line-height: 1; }
.logo b span { color: var(--gold); }
.place { font-size: 28px; font-weight: 700; opacity: .8; border: 2px solid rgba(244,241,232,.35); padding: 8px 22px; border-radius: 999px; }

.hook { display: grid; gap: 10px; }
.hook h1 { font-family: var(--display); font-weight: 400; font-size: 132px; line-height: 1.05; color: var(--gold); }
.hook p { font-size: 46px; font-weight: 700; line-height: 1.35; }

.photo { position: relative; flex: 1; min-height: 0; border-radius: 32px; overflow: hidden; border: 5px solid var(--gold); }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 60%; display: block; }
.price {
  position: absolute; right: 28px; bottom: 28px;
  background: var(--gold); color: var(--ink); border-radius: 24px; padding: 18px 30px;
  display: grid; gap: 2px; box-shadow: 0 14px 40px rgba(0,0,0,.35);
}
.price small { font-size: 28px; font-weight: 700; }
.price strong { font-family: var(--display); font-weight: 400; font-size: 84px; line-height: 1; }

.checks { display: flex; gap: 16px; }
.checks span { flex: 1; text-align: center; font-size: 32px; font-weight: 700; padding: 16px 10px; border-radius: 18px; background: rgba(244,241,232,.08); border: 2px solid rgba(244,241,232,.18); }
.checks span::before { content: "✓ "; color: var(--gold); }

.cta { display: flex; align-items: center; justify-content: space-between; gap: 20px; background: var(--wa); border-radius: 28px; padding: 26px 36px; color: #fff; }
.cta .lbl { display: flex; align-items: center; gap: 16px; font-size: 44px; font-weight: 700; }
.cta svg { width: 56px; height: 56px; }
.cta .num { direction: ltr; font-family: var(--display); font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: 1px; }
.link { text-align: center; font-size: 28px; opacity: .85; margin-top: -14px; }
.link b { color: var(--gold); direction: ltr; unicode-bidi: isolate; }
</style>
</head>
<body>
<svg class="stars" viewBox="0 0 1080 1350" aria-hidden="true">
  <circle cx="90" cy="70" r="2.4"/><circle cx="300" cy="190" r="1.6"/><circle cx="520" cy="60" r="2"/><circle cx="760" cy="210" r="1.5"/>
  <circle cx="980" cy="120" r="2.2"/><circle cx="160" cy="330" r="1.4"/><circle cx="620" cy="300" r="1.8"/><circle cx="1010" cy="420" r="1.5"/>
  <circle cx="60" cy="1180" r="1.8"/><circle cx="1030" cy="1060" r="1.6"/>
</svg>
<svg width="0" height="0" style="position:absolute">
  <symbol id="star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.8l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9l7.1-.6z"/></symbol>
  <symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2Zm4.52 11.99c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28Z"/></symbol>
</svg>

<header class="brand">
  <div class="logo"><svg><use href="#star"/></svg><b>شركة نجم <span>كار</span></b></div>
  <span class="place">كل المحافظات</span>
</header>

<div class="hook">
  <h1>عندك سفرية؟</h1>
  <p>عربية نضيفة وكابتن محترم مستنيك على باب البيت في معادك بالظبط</p>
</div>

<div class="photo">
  <img src="../images/elantra.jpg" alt="">
  <div class="price"><small>المطار وكل المحافظات</small><strong>سعر ثابت</strong></div>
</div>

<div class="checks"><span>عربية نضيفة</span><span>في المعاد</span><span>ذهاب وعودة</span></div>

<div class="cta">
  <span class="lbl"><svg><use href="#wa"/></svg>احجز على واتساب</span>
  <span class="num">01278021744</span>
</div>
<p class="link">كل الأسعار والحجز على موقعنا: <b>mohamedashraf-sp.github.io/Nagm-cars</b></p>
</body>
</html>
