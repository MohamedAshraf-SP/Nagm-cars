<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بوست المطار - شركة نجم كار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@500;700&display=block">
<style>
:root {
  --night: #0F1433; --night-2: #23307A; --on-night: #F4F1E8; --gold: #F4C247; --navy: #121838; --wa: #1FA855;
  --display: "Lalezar", "IBM Plex Sans Arabic", sans-serif; --body: "IBM Plex Sans Arabic", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  font-family: var(--body); color: var(--on-night);
  background: linear-gradient(170deg, var(--night-2) 0%, var(--night) 55%);
  padding: 60px; display: flex; flex-direction: column; gap: 28px; position: relative;
}
.sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.sky circle { fill: var(--on-night); }
.plane { color: var(--gold); opacity: .9; }
body > *:not(.sky) { position: relative; z-index: 1; }

.brand { display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 14px; }
.logo svg { width: 64px; height: 64px; color: var(--gold); }
.logo b { font-family: var(--display); font-weight: 400; font-size: 60px; line-height: 1; }
.pill { font-weight: 700; font-size: 28px; border: 2px solid rgba(244,241,232,.4); padding: 8px 22px; border-radius: 999px; }

.hook h1 { font-family: var(--display); font-weight: 400; font-size: 168px; line-height: 1; color: var(--gold); }
.hook p { font-size: 44px; font-weight: 700; line-height: 1.35; margin-top: 12px; }

.photo { position: relative; flex: 1; min-height: 0; border-radius: 34px; overflow: hidden; border: 6px solid var(--gold); }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 62%; display: block; }
.badge {
  position: absolute; right: 24px; top: 24px; background: var(--gold); color: var(--navy);
  border-radius: 20px; padding: 12px 24px; display: grid; box-shadow: 0 12px 30px rgba(0,0,0,.35);
}
.badge small { font-size: 26px; font-weight: 700; }
.badge strong { font-family: var(--display); font-weight: 400; font-size: 60px; line-height: 1.05; }

.list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.list span { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 30px; font-weight: 700; padding: 16px 8px; border-radius: 18px; background: rgba(244,241,232,.08); border: 2px solid rgba(244,241,232,.2); text-align: center; }
.list span::before { content: "✓"; color: var(--gold); }

.cta { display: flex; align-items: center; justify-content: space-between; gap: 20px; background: var(--wa); color: #fff; border-radius: 28px; padding: 24px 32px; }
.cta .lbl { display: flex; align-items: center; gap: 16px; font-size: 44px; font-weight: 700; }
.cta svg { width: 58px; height: 58px; }
.cta .num { direction: ltr; font-family: var(--display); font-weight: 400; font-size: 66px; line-height: 1; }
.link { text-align: center; font-size: 26px; opacity: .85; margin-top: -12px; }
.link b { color: var(--gold); direction: ltr; unicode-bidi: isolate; }
</style>
</head>
<body>
<svg class="sky" viewBox="0 0 1080 1350" aria-hidden="true">
  <circle cx="330" cy="40" r="2.4"/><circle cx="260" cy="200" r="1.6"/><circle cx="470" cy="70" r="2"/><circle cx="1000" cy="300" r="1.6"/>
  <circle cx="140" cy="380" r="1.4"/><circle cx="900" cy="80" r="2.2"/><circle cx="40" cy="1200" r="1.8"/>
  <g class="plane" transform="translate(150 255) rotate(-18) scale(3.4)"><path fill="currentColor" d="M2 16l20-6-3-3-6 2-6-5-2 1 4 5-5 2-2-1-1 1z"/></g>
  <path d="M60 330 Q 160 300 250 245" stroke="#F4C247" stroke-width="3" stroke-dasharray="10 12" fill="none" opacity=".6"/>
</svg>
<svg width="0" height="0" style="position:absolute">
  <symbol id="star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.8l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9l7.1-.6z"/></symbol>
  <symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2Zm4.52 11.99c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28Z"/></symbol>
</svg>

<header class="brand">
  <div class="logo"><svg><use href="#star"/></svg><b>شركة نجم كار</b></div>
  <span class="pill">كل المحافظات</span>
</header>

<div class="hook">
  <h1>رايح المطار؟</h1>
  <p>هنوصلك قبل ميعاد طيارتك بوقت كفاية، أو نستقبلك أول ما توصل</p>
</div>

<div class="photo">
  <img src="../images/elantra.jpg" alt="">
  <div class="badge"><small>سعر ثابت</small><strong>12 ج للكيلو</strong></div>
</div>

<div class="list"><span>بنتابع ميعاد الطيارة</span><span>مكان لشنطك</span><span>لحد باب البيت</span></div>

<div class="cta">
  <span class="lbl"><svg><use href="#wa"/></svg>احجز على واتساب</span>
  <span class="num">01043950220</span>
</div>
<p class="link">الأسعار والحجز: <b>mohamedashraf-sp.github.io/Nagm-cars</b></p>
</body>
</html>
